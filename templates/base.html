<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}نظام التأمين الصحي{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f5f7fa; }
    .sidebar { min-height: 100vh; background: #1a2942; color: #fff; }
    .sidebar .nav-link { color: #c8d6e5; border-radius: 8px; margin: 2px 8px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #2e4a6e; color: #fff; }
    .sidebar .brand { font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid #2e4a6e; }
    .main-content { padding: 24px; }
    .stat-card { border-radius: 12px; border: none; }
    .badge-status-pending { background: #f59e0b; }
    .badge-status-approved { background: #10b981; }
    .badge-status-rejected { background: #ef4444; }
    .badge-status-paid { background: #3b82f6; }
    .badge-status-partially_approved { background: #6366f1; }
    .progress { height: 10px; }
    .table th { background: #f1f5f9; font-weight: 600; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
<div class="container-fluid p-0">
  <div class="row g-0">
    <!-- Sidebar -->
    <div class="col-auto sidebar d-flex flex-column" style="width: 230px; min-height:100vh;">
      <div class="brand p-3 mb-2">
        <i class="bi bi-shield-plus-fill text-info ms-2"></i>
        نظام التأمين الصحي
      </div>
      <nav class="nav flex-column mt-2 flex-grow-1">
        <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
          <i class="bi bi-speedometer2 ms-2"></i> لوحة التحكم
        </a>
        <a href="{% url 'employee_list' %}" class="nav-link {% if 'employee' in request.resolver_match.url_name %}active{% endif %}">
          <i class="bi bi-people-fill ms-2"></i> الموظفون
        </a>
        <a href="{% url 'claim_list' %}" class="nav-link {% if 'claim' in request.resolver_match.url_name %}active{% endif %}">
          <i class="bi bi-file-medical-fill ms-2"></i> المطالبات
        </a>
        <a href="{% url 'claim_new' %}" class="nav-link">
          <i class="bi bi-plus-circle-fill ms-2"></i> مطالبة جديدة
        </a>
        <a href="{% url 'reports' %}" class="nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}">
          <i class="bi bi-bar-chart-fill ms-2"></i> التقارير
        </a>
        <a href="/admin/" class="nav-link mt-auto">
          <i class="bi bi-gear-fill ms-2"></i> الإعدادات
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="col main-content">
      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
