version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: insurance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: insurance_db
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_user -d insurance_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - insurance_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://insurance_user:insurance_pass@db:5432/insurance_db
      SECRET_KEY: super-secret-key-change-in-production-2026
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:80"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - insurance_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insurance_frontend
    restart: unless-stopped
    networks:
      - insurance_net
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: insurance_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - insurance_net

volumes:
  postgres_data:
  uploads_data:

networks:
  insurance_net:
    driver: bridge
