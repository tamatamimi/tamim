name: erp_guides_app
description: >-
  ERP Documentation Knowledge Base — offline-first mobile app for organizing
  written, visual, and procedural ERP guides (data-flow diagrams, use cases),
  bilingual Arabic/English with full RTL support.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  flutter_markdown: ^0.7.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
